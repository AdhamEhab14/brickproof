# Three-Tier secure bootloader (STM32F103RB), FBL self-update. Written for v2.0.0.
# https://github.com/AdhamEhab14/Three-Tier-STM32-Secure-Bootloader
#
# Build the target first, with the published TEST keys:
#   cmake -S . -B build-test -G Ninja "-DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake" -DBL_TEST_KEYS=ON
#   cmake --build build-test
# then:  brickproof run adapters/three_tier_f103/adapter.yaml --target <bootloader repo>

name: three_tier_f103
target: ../../../Three_Tier_Secure_Bootloader     # default: next to this repo

platform:
  base: stm32f103
  extra: platform_extra.repl

flash:
  base: 0x08000000
  size: 0x20000          # 128 KB
  page: 0x400            # 1 KB
  write_unit: 2          # halfword programming

ram:
  size: 0x5000         # 20 KB. Not optional: extra emulated RAM hides stack faults

firmware:
  - file: build-test/boot_manager.elf
  - file: build-test/fbl.elf

uart: usart2
reset:
  - gpioPortC OnGPIO 13 false     # hold B1 so the device stays in the bootloader
boot_settle: 1.5                  # Boot Manager LED delay (0.6 s) plus FBL start-up

driver:
  file: driver.py
  options:
    fbl_bin: build-test/fbl.bin
    version: "2.1.0"                # v2.0.0 refuses an FBL older than itself

# The two approved FBL images come from the driver (it signs the update at run time).
# A cut before the SBL starts leaves the old FBL, a later one must end with the new.
oracle:
  accept: [old_fbl, new_fbl]

scenario:
  name: fbl-self-update
  cut_limit: 30                   # virtual seconds to wait for a cut to fire
  update_time: 6                  # an uninterrupted self-update takes about 2 s on the board
  # The planner picks the cuts from the golden run: every state in the short phases
  # (the Boot Manager's state page), the edges plus samples in the long ones (the 40
  # erases and the 40 KB copy). `brickproof trace` shows the phases; `--plan every`
  # cuts all of them, which takes many hours for this update.
  plan: {mode: phases, per_phase: 4}

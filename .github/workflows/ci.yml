# unit  - lint, the tests that need no emulator, and a from-source build of the demo.
# demo  - the bundled demo bootloader from its committed prebuilt files, the way a
#         new user runs it: the correct one must survive a cut at every flash
#         state and every torn state, and each bug build must be caught (exit code 1,
#         not 0 or 3).
# action, docker, package - the three ways BrickProof is handed to someone else, each
#         built and used for real.
# e2e   - builds the Three-Tier bootloader (the first real target), then cuts power
#         during its FBL self-update in Renode and checks it recovers each time.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -v

      - name: Demo firmware builds from source
        run: |
          # the demo links no C library, so skip the 500 MB of recommended ones
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          python examples/demo_ab_bootloader/build.py

  # the pure-Python part on the oldest and newest Python we claim to support
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    name: compat (${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -v

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: adapter       # the correct build: every clean cut, every torn state,
            expect: 0              # and a second cut during recovery
            torn: true
            depth: 2
          - adapter: bug-consume_first
            expect: 1
          - adapter: bug-trust_header
            expect: 1
          - adapter: bug-naive_floor
            expect: 1
          - adapter: bug-pop_after_switch
            expect: 1
          - adapter: bug-no_erase
            expect: 1
          - adapter: bug-no_unlock
            expect: 1
          - adapter: bug-resume_copy   # passes every clean cut; only torn states catch it
            expect: 1
          - adapter: bug-retry_limit   # passes any single cut; only two in a row catch it
            expect: 1
          - adapter: bug-protected_slot   # the app slot write-protected by mistake
            expect: 1
          - adapter: bug-self_lock     # option bytes rewritten in the field: a cut wipes the chip
            expect: 1
          # the same demo on an STM32F411: sector erase, word programming, other option bytes
          - adapter: f411
            expect: 0
            torn: true
            depth: 2
          - adapter: f411-bug-consume_first
            expect: 1
          - adapter: f411-bug-trust_header
            expect: 1
          - adapter: f411-bug-naive_floor
            expect: 1
          - adapter: f411-bug-pop_after_switch
            expect: 1
          - adapter: f411-bug-no_erase   # not refused on an F4: the cells end up as old AND new
            expect: 1
          - adapter: f411-bug-no_unlock
            expect: 1
          - adapter: f411-bug-retry_limit
            expect: 1
          - adapter: f411-bug-protected_slot
            expect: 1
          - adapter: f411-bug-self_lock
            expect: 1
    name: demo (${{ matrix.adapter }})
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/renode
          curl -sL https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz \
            | tar xz -C ~/renode --strip-components=1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Cut power during the demo update
        run: |
          export RENODE_PATH="$HOME/renode/renode"
          flags="-j 3"                # the runner has four cores
          if [ "${{ matrix.expect }}" = 1 ]; then flags="--fail-fast"; fi
          if [ "${{ matrix.torn }}" = true ]; then flags="$flags --torn"; fi
          if [ -n "${{ matrix.depth }}" ]; then flags="$flags --depth ${{ matrix.depth }}"; fi
          set +e
          brickproof run examples/demo_ab_bootloader/${{ matrix.adapter }}.yaml $flags \
            --json brickproof-out/${{ matrix.adapter }}.json --junit brickproof-out/${{ matrix.adapter }}.xml --html brickproof-out/${{ matrix.adapter }}.html
          code=$?
          echo "exit code $code, expected ${{ matrix.expect }}"
          [ "$code" = "${{ matrix.expect }}" ]

      - name: Upload results
        if: always()
        # the results file is a convenience; GitHub's artifact service timing out
        # must not turn a passing run red
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.adapter }}
          path: brickproof-out/

  # the GitHub Action, used the way another repository would use it
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run the demo through the action
        uses: ./
        with:
          adapter: examples/demo_ab_bootloader/adapter.yaml
          args: --plan phases --per-phase 1 --torn -j 3
          artifact-name: action-report

      - name: The reports exist
        run: test -s brickproof-report/report.json -a -s brickproof-report/report.xml -a -s brickproof-report/report.html

  # the Docker image builds, and the demo runs inside it
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f docker/Dockerfile -t brickproof .

      - name: Run the bundled demo in it
        run: docker run --rm brickproof demo --plan phases --per-phase 1 -j 3

      - name: A bug build must fail with exit code 1
        run: |
          set +e
          docker run --rm brickproof demo no_erase --fail-fast
          [ $? -eq 1 ]

  # the package builds, installs clean, and brings the demo
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          pip install build
          python -m build

      - name: Install the wheel somewhere clean and list the demo
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          cd /tmp && /tmp/check/bin/brickproof demo --list | grep -q "bug-self_lock"

      - name: The sdist builds a wheel with the same files
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && python -m build --wheel -o /tmp/sdist-wheel
          a=$(unzip -Z1 "$GITHUB_WORKSPACE"/dist/*.whl | grep -v dist-info | sort)
          b=$(unzip -Z1 /tmp/sdist-wheel/*.whl | grep -v dist-info | sort)
          [ "$a" = "$b" ] || { diff <(echo "$a") <(echo "$b"); exit 1; }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Check out the target bootloader
        uses: actions/checkout@v4
        with:
          repository: AdhamEhab14/Three-Tier-STM32-Secure-Bootloader
          ref: v2.0.0          # pinned: the adapter is written for this release
          path: target

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/renode
          curl -sL https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz \
            | tar xz -C ~/renode --strip-components=1

      - name: Build the target with its published TEST keys
        working-directory: target
        run: |
          cmake -S . -B build-test -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DBL_TEST_KEYS=ON
          cmake --build build-test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" -r adapters/three_tier_f103/requirements.txt

      - name: Pull the plug during the FBL self-update
        run: |
          export RENODE_PATH="$HOME/renode/renode"
          brickproof run adapters/three_tier_f103/adapter.yaml --target target --torn --depth 2 -j 3 --json brickproof-out/three_tier.json --junit brickproof-out/three_tier.xml --html brickproof-out/three_tier.html

      - name: Upload results
        if: always()
        # the results file is a convenience; GitHub's artifact service timing out
        # must not turn a passing run red
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: brickproof-results
          path: brickproof-out/

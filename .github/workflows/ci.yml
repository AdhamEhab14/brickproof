# unit  - lint, the tests that need no emulator, and a from-source build of the demo.
# demo  - the bundled demo bootloader from its committed prebuilt files, the way a
#         new user runs it: the correct one must survive a cut at every flash
#         state and every torn state, and each bug build must be caught (exit code 1,
#         not 0 or 3).
# demo-m33mu - the same on the STM32H563, emulated by m33mu, through the action.
# action, docker, package - the three ways BrickProof is handed to someone else, each
#         built and used for real.
# model-rules - the flash models' chip rules, checked one by one in Renode.
# mcuboot - MCUboot from its prebuilt files on the Black Pill and the nRF52840 DK.
# storage - Zephyr's flash stores (NVS, littlefs, ZMS) under the storage workload.
# e2e   - builds the Three-Tier bootloader (the first real target), then cuts power
#         during its FBL self-update in Renode and checks it recovers each time.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -v

      - name: Demo firmware builds from source
        run: |
          # the demo links no C library, so skip the 500 MB of recommended ones
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          python examples/demo_ab_bootloader/build.py

  # the pure-Python part on the oldest and newest Python we claim to support
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    name: compat (${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -v

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: adapter       # the correct build: every clean cut, every torn state,
            expect: 0              # and a second cut during recovery
            torn: true
            depth: 2
          - adapter: bug-consume_first
            expect: 1
          - adapter: bug-trust_header
            expect: 1
          - adapter: bug-naive_floor
            expect: 1
          - adapter: bug-pop_after_switch
            expect: 1
          - adapter: bug-no_erase
            expect: 1
          - adapter: bug-no_unlock
            expect: 1
          - adapter: bug-resume_copy   # passes every clean cut; only torn states catch it
            expect: 1
          - adapter: bug-retry_limit   # passes any single cut; only two in a row catch it
            expect: 1
          - adapter: bug-protected_slot   # the app slot write-protected by mistake
            expect: 1
          - adapter: bug-self_lock     # option bytes rewritten in the field: a cut wipes the chip
            expect: 1
          - adapter: watchdog          # the correct build under a hardware watchdog
            expect: 0
          - adapter: hold_pg           # PG held over runs of cells: cuts between the stores
            expect: 0
            torn: true
          - adapter: bug-early_unpg    # every second cell stored after PG was cleared
            expect: 1
          # the same demo on an STM32F411: sector erase, word programming, other option bytes
          - adapter: f411
            expect: 0
            torn: true
            depth: 2
          - adapter: f411-bug-consume_first
            expect: 1
          - adapter: f411-bug-trust_header
            expect: 1
          - adapter: f411-bug-naive_floor
            expect: 1
          - adapter: f411-bug-pop_after_switch
            expect: 1
          - adapter: f411-bug-no_erase   # not refused on an F4: the cells end up as old AND new
            expect: 1
          - adapter: f411-bug-no_unlock
            expect: 1
          - adapter: f411-bug-retry_limit
            expect: 1
          - adapter: f411-bug-protected_slot
            expect: 1
          - adapter: f411-bug-self_lock
            expect: 1
          - adapter: f411-watchdog     # a one-second erase under a half-second watchdog, done right
            expect: 0
          - adapter: f411-bug-watchdog   # and done wrong: reset in the middle of every erase
            expect: 1
          - adapter: f411-hold_pg
            expect: 0
            torn: true
          - adapter: f411-bug-early_unpg
            expect: 1
          - adapter: f411-ext          # staged image and rollback floor in an external SPI NOR chip
            expect: 0
            torn: true
            depth: 2
          - adapter: f411-ext-bug-consume_first
            expect: 1
          - adapter: f411-ee           # rollback floor in an I2C EEPROM
            expect: 0
            torn: true
            depth: 2
          - adapter: f411-ee-bug-no_invalidate   # passes every clean cut; only torn writes catch it
            expect: 1
            torn: true
          # and on an STM32L476: 2 KB pages, 64-bit programs, ECC on every double word
          - adapter: l476
            expect: 0
            torn: true
            depth: 2
          - adapter: l476-bug-no_ecc_nmi   # passes every clean cut; only torn states catch it
            expect: 1
            torn: true
          - adapter: l476-bug-consume_first
            expect: 1
          - adapter: l476-bug-trust_header
            expect: 1
          - adapter: l476-bug-naive_floor
            expect: 1
          - adapter: l476-bug-pop_after_switch
            expect: 1
          - adapter: l476-bug-no_erase     # a double word programmed twice: refused (PROGERR)
            expect: 1
          - adapter: l476-bug-no_unlock
            expect: 1
          - adapter: l476-bug-early_unpg
            expect: 1
          - adapter: l476-bug-protected_slot
            expect: 1
          - adapter: l476-bug-resume_copy
            expect: 1
          - adapter: l476-bug-retry_limit
            expect: 1
          - adapter: l476-hold_pg
            expect: 0
            torn: true
          # and on an nRF52840: 4 KB pages, no flash keys, two writes to a word between erases
          - adapter: nrf52
            expect: 0
            torn: true
            depth: 2
          - adapter: nrf52-bug-consume_first
            expect: 1
          - adapter: nrf52-bug-trust_header
            expect: 1
          - adapter: nrf52-bug-naive_floor
            expect: 1
          - adapter: nrf52-bug-pop_after_switch
            expect: 1
          - adapter: nrf52-bug-no_erase
            expect: 1
          - adapter: nrf52-bug-retry_limit
            expect: 1
          - adapter: nrf52-bug-early_unpg   # stores made with CONFIG back to read-only
            expect: 1
          - adapter: nrf52-bug-nwrite       # a third write to a word without an erase
            expect: 1
          - adapter: nrf52-hold_pg
            expect: 0
            torn: true
    name: demo (${{ matrix.adapter }})
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/renode
          curl -sL https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz \
            | tar xz -C ~/renode --strip-components=1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Cut power during the demo update
        run: |
          export RENODE_PATH="$HOME/renode/renode"
          flags="-j 3"                # the runner has four cores
          if [ "${{ matrix.expect }}" = 1 ]; then flags="--fail-fast"; fi
          if [ "${{ matrix.torn }}" = true ]; then flags="$flags --torn"; fi
          if [ -n "${{ matrix.depth }}" ]; then flags="$flags --depth ${{ matrix.depth }}"; fi
          set +e
          brickproof run examples/demo_ab_bootloader/${{ matrix.adapter }}.yaml $flags \
            --json brickproof-out/${{ matrix.adapter }}.json --junit brickproof-out/${{ matrix.adapter }}.xml --html brickproof-out/${{ matrix.adapter }}.html
          code=$?
          echo "exit code $code, expected ${{ matrix.expect }}"
          [ "$code" = "${{ matrix.expect }}" ]

      - name: Upload results
        if: always()
        # the results file is a convenience; GitHub's artifact service timing out
        # must not turn a passing run red
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.adapter }}
          path: brickproof-out/

  # the flash models' chip rules, one register or one store at a time, in Renode
  model-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/renode
          curl -sL https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz \
            | tar xz -C ~/renode --strip-components=1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: The chip rules
        run: |
          export RENODE_PATH="$HOME/renode/renode"
          python -m pytest -v tests/renode

  # MCUboot from its committed prebuilt files, on both boards. A full campaign takes over an
  # hour per board on a runner (392,000 byte programs on the F411), so CI cuts every edge
  # between phases, one sample inside each long phase, and powers three in four of those
  # cuts up from the computed state; the real ones check that state byte for byte. Every
  # F411 cut redoes the rest of a 128 KB byte-by-byte swap, so its 42 cuts are split over
  # four runners; the four shards together are the whole plan.
  mcuboot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: f411, shard: 1/4}
          - {board: f411, shard: 2/4}
          - {board: f411, shard: 3/4}
          - {board: f411, shard: 4/4}
          - {board: nrf52840, shard: 1/1}
    name: mcuboot (${{ matrix.board }} ${{ matrix.shard }})
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/renode
          curl -sL https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz \
            | tar xz -C ~/renode --strip-components=1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Cut power during MCUboot's swap
        run: |
          export RENODE_PATH="$HOME/renode/renode"
          out=brickproof-out/mcuboot-${{ matrix.board }}-$(echo "${{ matrix.shard }}" | tr / -)
          brickproof run adapters/mcuboot/${{ matrix.board }}.yaml --per-phase 1 --real-every 4 -j 3 \
            --shard "${{ matrix.shard }}" --json "$out.json" --junit "$out.xml" --html "$out.html"

      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mcuboot-${{ matrix.board }}-${{ strategy.job-index }}
          path: brickproof-out/

  # Zephyr's flash stores from their committed prebuilt workload, judged by the storage
  # driver. NVS and littlefs must recover from every cut; ZMS loses a write after a cut
  # inside a value (zephyrproject-rtos/zephyr#121747) and settings on FCB loses settings
  # (#122446, #121749), so those must be caught until they are fixed upstream.
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {store: nvs, expect: 0}
          - {store: littlefs, expect: 0}
          - {store: zms, expect: 1}
          - {store: settings_fcb, expect: 1}   # zephyrproject-rtos/zephyr#122446 and #121749
    name: storage (${{ matrix.store }})
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/renode
          curl -sL https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz \
            | tar xz -C ~/renode --strip-components=1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Cut power during the storage workload
        run: |
          export RENODE_PATH="$HOME/renode/renode"
          flags="-j 3"
          if [ "${{ matrix.expect }}" = 1 ]; then flags="--fail-fast"; fi
          set +e
          brickproof run adapters/zephyr_storage/${{ matrix.store }}.yaml $flags \
            --json brickproof-out/${{ matrix.store }}.json --junit brickproof-out/${{ matrix.store }}.xml \
            --html brickproof-out/${{ matrix.store }}.html
          code=$?
          echo "exit code $code, expected ${{ matrix.expect }}"
          [ "$code" = "${{ matrix.expect }}" ]

      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: storage-${{ matrix.store }}
          path: brickproof-out/

  # the demo on the STM32H563. m33mu emulates it; the action builds m33mu at the
  # commit it pins (once, then from its cache) and runs the adapter
  demo-m33mu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: h563             # the correct build: every clean cut, every torn state,
            expect: 0                 # and a second cut during recovery
            args: -j 3 --torn --depth 2
          - adapter: h563-hold_pg
            expect: 0
            args: -j 3 --torn
          - adapter: h563-bug-consume_first
            expect: 1
          - adapter: h563-bug-trust_header
            expect: 1
          - adapter: h563-bug-naive_floor
            expect: 1
          - adapter: h563-bug-pop_after_switch   # the core locks up on every boot
            expect: 1
          - adapter: h563-bug-no_erase           # a 128-bit word programmed twice: refused
            expect: 1
          - adapter: h563-bug-no_unlock
            expect: 1
          - adapter: h563-bug-early_unpg
            expect: 1
          - adapter: h563-bug-protected_slot     # WRPSG protects the app slot by mistake
            expect: 1
          - adapter: h563-bug-resume_copy        # only torn states catch it (torn: true in it)
            expect: 1
          - adapter: h563-bug-retry_limit        # only two cuts in a row catch it (depth 2 in it)
            expect: 1
    name: demo-m33mu (${{ matrix.adapter }})
    steps:
      - uses: actions/checkout@v4

      - name: Cut power during the demo update
        id: bp
        uses: ./
        continue-on-error: true
        with:
          adapter: examples/demo_ab_bootloader/${{ matrix.adapter }}.yaml
          args: ${{ matrix.expect == 1 && '--fail-fast' || matrix.args }}
          artifact-name: demo-m33mu-${{ matrix.adapter }}

      - name: Check the exit code
        run: |
          echo "exit code ${{ steps.bp.outputs.exit-code }}, expected ${{ matrix.expect }}"
          [ "${{ steps.bp.outputs.exit-code }}" = "${{ matrix.expect }}" ]

      - name: The m33mu backend's tests, against this m33mu
        if: matrix.adapter == 'h563'
        run: |
          pip install pytest
          M33MU_PATH="$HOME/m33mu-bin/m33mu" python -m pytest -v tests/test_m33mu.py

  # the GitHub Action, used the way another repository would use it
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run the demo through the action
        uses: ./
        with:
          adapter: examples/demo_ab_bootloader/adapter.yaml
          args: --plan phases --per-phase 1 --torn -j 3
          artifact-name: action-report

      - name: The reports exist
        run: test -s brickproof-report/report.json -a -s brickproof-report/report.xml -a -s brickproof-report/report.html

  # the Docker image builds, and the demo runs inside it
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f docker/Dockerfile -t brickproof .

      - name: Run the bundled demo in it
        run: docker run --rm brickproof demo --plan phases --per-phase 1 -j 3

      - name: A bug build must fail with exit code 1
        run: |
          set +e
          docker run --rm brickproof demo no_erase --fail-fast
          [ $? -eq 1 ]

      - name: The demo on the STM32H563, on the image's m33mu
        run: docker run --rm brickproof demo h563 --plan phases --per-phase 1 -j 3

  # the package builds, installs clean, and brings the demo
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          pip install build
          python -m build

      - name: Install the wheel somewhere clean and list the demo
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          cd /tmp && /tmp/check/bin/brickproof demo --list | grep -q "bug-self_lock"

      - name: The sdist builds a wheel with the same files
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && python -m build --wheel -o /tmp/sdist-wheel
          a=$(unzip -Z1 "$GITHUB_WORKSPACE"/dist/*.whl | grep -v dist-info | sort)
          b=$(unzip -Z1 /tmp/sdist-wheel/*.whl | grep -v dist-info | sort)
          [ "$a" = "$b" ] || { diff <(echo "$a") <(echo "$b"); exit 1; }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENODE_VERSION: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Check out the target bootloader
        uses: actions/checkout@v4
        with:
          repository: AdhamEhab14/Three-Tier-STM32-Secure-Bootloader
          ref: v2.0.0          # pinned: the adapter is written for this release
          path: target

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-linux

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/renode
          curl -sL https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz \
            | tar xz -C ~/renode --strip-components=1

      - name: Build the target with its published TEST keys
        working-directory: target
        run: |
          cmake -S . -B build-test -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DBL_TEST_KEYS=ON
          cmake --build build-test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" -r adapters/three_tier_f103/requirements.txt

      - name: Pull the plug during the FBL self-update
        run: |
          export RENODE_PATH="$HOME/renode/renode"
          brickproof run adapters/three_tier_f103/adapter.yaml --target target --torn --depth 2 -j 3 --json brickproof-out/three_tier.json --junit brickproof-out/three_tier.xml --html brickproof-out/three_tier.html

      - name: Upload results
        if: always()
        # the results file is a convenience; GitHub's artifact service timing out
        # must not turn a passing run red
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: brickproof-results
          path: brickproof-out/

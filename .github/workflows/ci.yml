# What CI checks, and when.
#
# On every pull request and push:
#   checks    - lint, the unit tests (no emulator), and the demo firmware built from source
#   compat    - the unit tests on the oldest and newest Python we support
#   package   - the wheel and the sdist build, install clean and bring the demo
# When anything but documentation changed, and on main, every night and by hand:
#   model-rules - the flash models' chip rules, one register or store at a time, in Renode
#   scenarios - every campaign in tests/scenarios.yaml (the demo on five chips, MCUboot,
#               Zephyr's flash stores), shared out over a few jobs by their running time,
#               each exit code checked against the one the manifest expects
#   e2e       - the Three-Tier bootloader built from source, cut during its FBL self-update
#   action    - the GitHub Action used the way another repository would (Renode and m33mu)
#   docker    - the image builds and runs the demo
#   parity    - every report of this run against tests/parity/baseline.json: a change not
#               meant to change results leaves every verdict, coverage figure and cut alone
# ci-ok is the one required check: green when everything that had to run passed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"       # every night, so a change outside this repo (a runner image,
                               # a cache) shows up within a day
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # does this change need the emulators? Not if it only touches documentation
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          code=$(echo "$changed" | grep -vE '^docs/|\.md$|^LICENSE$|^\.gitignore$|^\.gitattributes$' | head -1)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          arm-toolchain: "true"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -v
      - name: Demo firmware builds from source
        run: python examples/demo_ab_bootloader/build.py

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    name: compat (${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m pytest -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          pip install build
          python -m build
      - name: Install the wheel somewhere clean and list the demo
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          cd /tmp && /tmp/check/bin/brickproof demo --list | grep -q "bug-self_lock"
      - name: The sdist builds a wheel with the same files
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && python -m build --wheel -o /tmp/sdist-wheel
          a=$(unzip -Z1 "$GITHUB_WORKSPACE"/dist/*.whl | grep -v dist-info | sort)
          b=$(unzip -Z1 /tmp/sdist-wheel/*.whl | grep -v dist-info | sort)
          [ "$a" = "$b" ] || { diff <(echo "$a") <(echo "$b"); exit 1; }

  model-rules:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          renode: "true"
      - name: The chip rules
        run: python -m pytest -v tests/renode

  scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {emulator: renode, part: 1/8}
          - {emulator: renode, part: 2/8}
          - {emulator: renode, part: 3/8}
          - {emulator: renode, part: 4/8}
          - {emulator: renode, part: 5/8}
          - {emulator: renode, part: 6/8}
          - {emulator: renode, part: 7/8}
          - {emulator: renode, part: 8/8}
          - {emulator: m33mu, part: 1/1}
    name: scenarios (${{ matrix.emulator }} ${{ matrix.part }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          renode: ${{ matrix.emulator == 'renode' }}
          m33mu: ${{ matrix.emulator == 'm33mu' }}
      - name: Which campaigns this job runs
        run: python tools/scenarios.py list --emulator ${{ matrix.emulator }} --part ${{ matrix.part }}
      - name: Run them
        run: python tools/scenarios.py run --emulator ${{ matrix.emulator }} --part ${{ matrix.part }} --out brickproof-out
      - name: The m33mu backend's tests, against this m33mu
        if: matrix.emulator == 'm33mu'
        run: python -m pytest -v tests/test_m33mu.py
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-scenarios-${{ matrix.emulator }}-${{ strategy.job-index }}
          path: brickproof-out/

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Check out the target bootloader
        uses: actions/checkout@v4
        with:
          repository: AdhamEhab14/Three-Tier-STM32-Secure-Bootloader
          ref: v2.0.0          # pinned: the adapter is written for this release
          path: target
      - uses: ./.github/actions/setup
        with:
          install: -e .[dev] -r adapters/three_tier_f103/requirements.txt
          renode: "true"
          arm-toolchain: "true"
      - name: Build the target with its published TEST keys
        working-directory: target
        run: |
          cmake -S . -B build-test -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DBL_TEST_KEYS=ON
          cmake --build build-test
      - name: Pull the plug during the FBL self-update
        timeout-minutes: 65
        run: |
          brickproof run adapters/three_tier_f103/adapter.yaml --target target --torn --depth 2 -j 3 \
            --json brickproof-out/three_tier.json --junit brickproof-out/three_tier.xml --html brickproof-out/three_tier.html
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-e2e
          path: brickproof-out/

  # the GitHub Action, used the way another repository would use it, on both emulators
  action:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: renode, adapter: adapter, args: --plan phases --per-phase 1 --torn -j 3, expect: 0,
             artifact: reports-action-renode}
          # m33mu built and cached by the action itself. The scenarios run this campaign
          # too, so its report stays out of the parity check (not reports-*)
          - {name: m33mu, adapter: h563-bug-consume_first, args: --fail-fast, expect: 1,
             artifact: action-m33mu}
    name: action (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Run the demo through the action
        id: bp
        uses: ./
        continue-on-error: true
        with:
          adapter: examples/demo_ab_bootloader/${{ matrix.adapter }}.yaml
          args: ${{ matrix.args }}
          artifact-name: ${{ matrix.artifact }}
      - name: The exit code and the reports
        run: |
          echo "exit code ${{ steps.bp.outputs.exit-code }}, expected ${{ matrix.expect }}"
          [ "${{ steps.bp.outputs.exit-code }}" = "${{ matrix.expect }}" ]
          test -s brickproof-report/report.json -a -s brickproof-report/report.xml -a -s brickproof-report/report.html

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f docker/Dockerfile -t brickproof .
      - name: Run the bundled demo in it
        run: docker run --rm brickproof demo --plan phases --per-phase 1 -j 3
      - name: A bug build must fail with exit code 1
        run: |
          set +e
          docker run --rm brickproof demo no_erase --fail-fast
          [ $? -eq 1 ]

  parity:
    needs: [changes, scenarios, e2e, action]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every report of this run
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: reports
      - name: Compare with the baseline
        run: python tools/parity.py compare tests/parity/baseline.json reports

  # The one required check. Green when every job that had to run passed; the emulator
  # jobs are skipped on a change to documentation only, and that is fine.
  ci-ok:
    needs: [changes, checks, compat, package, model-rules, scenarios, e2e, action, docker, parity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Everything that had to run passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          code = os.environ["CODE"] == "true"
          always = {"changes", "checks", "compat", "package"}
          bad = [n for n, r in needs.items()
                 if r["result"] != "success" and (code or n in always)]
          for n, r in sorted(needs.items()):
              print("%-12s %s" % (n, r["result"]))
          if bad:
              sys.exit("not passed: " + ", ".join(sorted(bad)))
          '

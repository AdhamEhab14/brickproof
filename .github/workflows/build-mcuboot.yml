name: build-mcuboot
on:
  push:
    branches: [mcuboot-modes]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build device-tree-compiler
          pip install west
      - name: Zephyr v4.2.0 with MCUboot
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.2.0 ~/zp
          cd ~/zp
          west config manifest.project-filter -- '-.*,+mcuboot,+hal_stm32,+hal_nordic,+cmsis,+cmsis_6'
          west update --narrow -o=--depth=1
          cd bootloader/mcuboot
          git fetch --depth=1 origin 4eba8087fa606db801455f14d185255bc8c49467
          git checkout 4eba8087fa606db801455f14d185255bc8c49467
          cd ~/zp
          pip install -r zephyr/scripts/requirements-base.txt -r bootloader/mcuboot/scripts/requirements.txt
      - name: Build overwrite-only for the F411
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: gnuarmemb
          GNUARMEMB_TOOLCHAIN_PATH: /usr
        run: |
          python adapters/mcuboot/build.py ~/zp out/f411-overwrite f411 overwrite
          rm -rf out/f411-overwrite/build
      - uses: actions/upload-artifact@v4
        with:
          name: mcuboot-f411-overwrite
          path: out/
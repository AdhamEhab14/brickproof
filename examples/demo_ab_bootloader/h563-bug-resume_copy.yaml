# The H563 demo with a "resume instead of restart" optimisation (see BUG_RESUME_COPY in
# bootloader/main.c). It survives a clean cut at every flash state. A torn program
# leaves a 128-bit word half written, and the H563 will not program that word again
# without an erase. Only torn states show the bug.
extends: h563.yaml
name: demo_ab_bootloader_h563_bug_resume_copy
firmware:
  - file: prebuilt/h563_bootloader_bug_resume_copy.elf
  - file: prebuilt/h563_app_v1.img
    addr: 0x0C010000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0C008000
scenario:
  torn: true

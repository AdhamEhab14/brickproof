# The demo keeping "already paused" in a RAM variable start-up leaves alone (see
# BUG_STANDBY_RAM in bootloader/main.c). Standby loses RAM, so every wake pauses again, for
# ever. A plain emulator keeps RAM through Standby and lets it through. BrickProof should fail
# the baseline.
extends: standby.yaml
name: demo_ab_bootloader_bug_standby_ram
firmware:
  - file: prebuilt/bootloader_bug_standby_ram.elf
  - file: prebuilt/app_v1.img
    addr: 0x08002000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0801E000

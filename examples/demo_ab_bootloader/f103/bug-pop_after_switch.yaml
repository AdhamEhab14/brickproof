# The demo with the bug a real board found and the emulator first missed
# (see BUG_POP_AFTER_SWITCH in firmware/bootloader/main.c): a pop from the new stack,
# past the end of RAM. BrickProof should fail the baseline with a bus fault.
extends: adapter.yaml
name: demo_ab_bootloader_bug_pop_after_switch
firmware:
  - file: prebuilt/bootloader_bug_pop_after_switch.elf
  - file: prebuilt/app_v1.img
    addr: 0x08002000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0801E000

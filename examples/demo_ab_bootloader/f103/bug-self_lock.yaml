# The demo write-protecting its own bootloader pages from inside the bootloader
# (see BUG_SELF_LOCK in firmware/bootloader/main.c). Option bytes have to be erased before
# they are rewritten. A cut in between leaves the chip read-protected, and the next
# attempt to write "unprotected" makes it mass-erase its flash.
extends: adapter.yaml
name: demo_ab_bootloader_bug_self_lock
flash:
  write_protected: []          # this build starts unlocked and locks itself
firmware:
  - file: prebuilt/bootloader_bug_self_lock.elf
  - file: prebuilt/app_v1.img
    addr: 0x08002000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0801E000

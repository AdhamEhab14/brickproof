# The demo with a retry limit (see BUG_RETRY_LIMIT in firmware/bootloader/main.c): after two
# interrupted install attempts it gives up on the update. It survives any single
# power cut, clean or torn. Only a second cut, during the recovery from a first
# one, shows the bug, so this one needs depth 2 to be caught.
extends: adapter.yaml
name: demo_ab_bootloader_bug_retry_limit
firmware:
  - file: prebuilt/bootloader_bug_retry_limit.elf
  - file: prebuilt/app_v1.img
    addr: 0x08002000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0801E000
scenario:
  depth: 2

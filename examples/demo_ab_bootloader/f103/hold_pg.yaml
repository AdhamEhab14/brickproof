# The correct demo written the other common way: PG is set once and left set over a
# whole run of cells (see HOLD_PG in firmware/bootloader/main.c). A power cut can fall between
# any two of those stores, and every one of them must recover.
extends: adapter.yaml
name: demo_ab_bootloader_hold_pg
firmware:
  - file: prebuilt/bootloader_hold_pg.elf
  - file: prebuilt/app_v1.img
    addr: 0x08002000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0801E000

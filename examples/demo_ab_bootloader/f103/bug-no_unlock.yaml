# The demo never unlocking the flash controller for the install
# (see BUG_NO_UNLOCK in firmware/bootloader/main.c). In a plain emulator the update
# appears to work; on a chip nothing is written. BrickProof should fail the baseline.
extends: adapter.yaml
name: demo_ab_bootloader_bug_no_unlock
firmware:
  - file: prebuilt/bootloader_bug_no_unlock.elf
  - file: prebuilt/app_v1.img
    addr: 0x08002000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0801E000

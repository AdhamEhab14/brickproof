# The demo copying the new image over the old one without erasing first
# (see BUG_NO_ERASE in firmware/bootloader/main.c). Renode's plain memory would accept
# that; a chip does not. BrickProof should fail the baseline: programs refused.
extends: adapter.yaml
name: demo_ab_bootloader_bug_no_erase
firmware:
  - file: prebuilt/bootloader_bug_no_erase.elf
  - file: prebuilt/app_v1.img
    addr: 0x08002000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0801E000

# The demo with a "resume instead of restart" optimisation (see BUG_RESUME_COPY in
# firmware/bootloader/main.c). It survives a clean cut at every flash state. Only a torn
# operation shows the bug, so this one needs torn states to be caught.
extends: adapter.yaml
name: demo_ab_bootloader_bug_resume_copy
firmware:
  - file: prebuilt/bootloader_bug_resume_copy.elf
  - file: prebuilt/app_v1.img
    addr: 0x08002000
  - file: prebuilt/meta_floor1.bin
    addr: 0x0801E000
scenario:
  torn: true

# The correct demo bootloader on a device whose application slot was write-protected
# by mistake (a production-line setting). An emulator with plain flash memory lets
# the update through. On the chip nothing in Slot A can be erased or programmed.
extends: adapter.yaml
name: demo_ab_bootloader_bug_protected_slot
flash:
  write_protected:
    - {from: 0x08000000, size: 0x2000}     # the bootloader, as intended
    - {from: 0x08002000, size: 0xE000}     # Slot A, by mistake

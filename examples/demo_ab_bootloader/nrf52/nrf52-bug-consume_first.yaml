# The nRF52840 demo with a known bug put back (see BUG_CONSUME_FIRST in firmware/bootloader/main.c):
# Slot B is marked consumed before the copy. BrickProof should fail at least one cut.
extends: nrf52.yaml
name: demo_ab_bootloader_nrf52_bug_consume_first
firmware:
  - file: prebuilt/nrf52_bootloader_bug_consume_first.elf
  - file: prebuilt/nrf52_app_v1.img
    addr: 0x10000
  - file: prebuilt/meta_floor1.bin
    addr: 0x4000

# The nRF52840 demo with the bug a real board found and the emulator first missed
# (see BUG_POP_AFTER_SWITCH in firmware/bootloader/main.c): a pop from the new stack,
# past the end of RAM. BrickProof should fail the baseline with a bus fault.
extends: nrf52.yaml
name: demo_ab_bootloader_nrf52_bug_pop_after_switch
firmware:
  - file: prebuilt/nrf52_bootloader_bug_pop_after_switch.elf
  - file: prebuilt/nrf52_app_v1.img
    addr: 0x10000
  - file: prebuilt/meta_floor1.bin
    addr: 0x4000

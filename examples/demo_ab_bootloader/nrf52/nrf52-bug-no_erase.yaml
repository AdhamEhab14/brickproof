# The nRF52840 demo copying the new image over the old one without erasing first
# (see BUG_NO_ERASE in firmware/bootloader/main.c). Like an F4, the nRF52 does not refuse that:
# each word ends up as the old value AND the new one, which is neither image. Renode's
# plain memory would just store the new value. BrickProof should fail the baseline.
extends: nrf52.yaml
name: demo_ab_bootloader_nrf52_bug_no_erase
firmware:
  - file: prebuilt/nrf52_bootloader_bug_no_erase.elf
  - file: prebuilt/nrf52_app_v1.img
    addr: 0x10000
  - file: prebuilt/meta_floor1.bin
    addr: 0x4000

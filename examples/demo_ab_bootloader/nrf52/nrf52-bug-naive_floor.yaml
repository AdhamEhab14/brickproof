# The nRF52840 demo with a known bug put back (see BUG_NAIVE_FLOOR in firmware/bootloader/main.c).
# BrickProof should fail at least one cut.
extends: nrf52.yaml
name: demo_ab_bootloader_nrf52_bug_naive_floor
firmware:
  - file: prebuilt/nrf52_bootloader_bug_naive_floor.elf
  - file: prebuilt/nrf52_app_v1.img
    addr: 0x10000
  - file: prebuilt/meta_floor1.bin
    addr: 0x4000

# The nRF52840 demo with a known bug put back (see BUG_TRUST_HEADER in bootloader/main.c):
# the header goes in first and only its magic is checked. BrickProof should fail at
# least one cut.
extends: nrf52.yaml
name: demo_ab_bootloader_nrf52_bug_trust_header
firmware:
  - file: prebuilt/nrf52_bootloader_bug_trust_header.elf
  - file: prebuilt/nrf52_app_v1.img
    addr: 0x10000
  - file: prebuilt/meta_floor1.bin
    addr: 0x4000

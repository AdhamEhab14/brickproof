# The L476 demo never unlocking the flash controller for the install
# (see BUG_NO_UNLOCK in bootloader/main.c). In a plain emulator the update
# appears to work; on a chip nothing is written. BrickProof should fail the baseline.
extends: l476.yaml
name: demo_ab_bootloader_l476_bug_no_unlock
firmware:
  - file: prebuilt/l476_bootloader_bug_no_unlock.elf
  - file: prebuilt/l476_app_v1.img
    addr: 0x08020000
  - file: prebuilt/meta_floor1.bin
    addr: 0x08004000

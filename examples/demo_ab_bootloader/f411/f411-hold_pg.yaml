# The correct F411 demo written the other common way: PG is set once and left set over a
# whole run of cells (see HOLD_PG in firmware/bootloader/main.c). A power cut can fall between
# any two of those stores, and every one of them must recover.
extends: f411.yaml
name: demo_ab_bootloader_f411_hold_pg
firmware:
  - file: prebuilt/f411_bootloader_hold_pg.elf
  - file: prebuilt/f411_app_v1.img
    addr: 0x08020000
  - file: prebuilt/meta_floor1.bin
    addr: 0x08004000

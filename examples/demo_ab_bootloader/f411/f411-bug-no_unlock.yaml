# The F411 demo never unlocking the flash controller for the install
# (see BUG_NO_UNLOCK in firmware/bootloader/main.c). In a plain emulator the update
# appears to work; on a chip nothing is written. BrickProof should fail the baseline.
extends: f411.yaml
name: demo_ab_bootloader_f411_bug_no_unlock
firmware:
  - file: prebuilt/f411_bootloader_bug_no_unlock.elf
  - file: prebuilt/f411_app_v1.img
    addr: 0x08020000
  - file: prebuilt/meta_floor1.bin
    addr: 0x08004000

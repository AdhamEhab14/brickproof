# The F411 demo with the rollback floor in an I2C EEPROM (a 24C256 on I2C1; see
# EEPROM_FLOOR in firmware/bootloader/main.c). Each page write of the EEPROM is an operation like
# those of the flash, counted in the order they happen, and a power cut can fall on any
# of them. A write cut short is part way through erasing or writing the page (the page-*
# torn states). The device has been updated before: both floor records are written, so the
# next one goes over an old record, not into a blank page.
extends: f411.yaml
name: demo_ab_bootloader_f411_ee

external_eeprom:
  bus: i2c1
  size: 0x8000                       # 32 KB
  page: 64

firmware:
  - file: prebuilt/f411_bootloader_ee.elf
  - file: prebuilt/f411_app_v1.img
    addr: 0x08020000
  - file: prebuilt/meta_floor1.bin
    addr: 0xB0000000                 # in the EEPROM, at offset 0
  - file: prebuilt/meta_floor1_seq2.bin
    addr: 0xB0000040                 # the second record, one page on

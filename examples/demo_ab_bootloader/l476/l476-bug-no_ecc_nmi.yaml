# The L476 demo without its NMI handler (BUG_NO_ECC_NMI in firmware/bootloader/main.c). Every clean
# cut passes: a finished erase or program leaves its ECC right. An erase or program cut
# short leaves double words whose ECC does not match, the next read of one raises an NMI,
# and the default handler hangs. Only torn states catch it.
extends: l476.yaml
name: demo_ab_bootloader_l476_bug_no_ecc_nmi
firmware:
  - file: prebuilt/l476_bootloader_bug_no_ecc_nmi.elf
  - file: prebuilt/l476_app_v1.img
    addr: 0x08020000
  - file: prebuilt/meta_floor1.bin
    addr: 0x08004000
scenario:
  torn: true

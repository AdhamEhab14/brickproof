# The L476 demo with a retry limit (see BUG_RETRY_LIMIT in firmware/bootloader/main.c): after two
# interrupted install attempts it gives up on the update. It survives any single
# power cut, clean or torn. Only a second cut, during the recovery from a first
# one, shows the bug, so this one needs depth 2 to be caught.
extends: l476.yaml
name: demo_ab_bootloader_l476_bug_retry_limit
firmware:
  - file: prebuilt/l476_bootloader_bug_retry_limit.elf
  - file: prebuilt/l476_app_v1.img
    addr: 0x08020000
  - file: prebuilt/meta_floor1.bin
    addr: 0x08004000
scenario:
  depth: 2

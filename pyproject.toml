[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brickproof-fw"
# the version is in one place, src/brickproof/__init__.py (see docs/releasing.md)
dynamic = ["version"]
description = "Power-fail testing for firmware updates: cut power at every flash operation in Renode and check the device recovers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adham Ehab" }]
keywords = ["firmware", "bootloader", "ota", "power-loss", "fault-injection", "renode", "embedded", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
brickproof = "brickproof.cli:main"

[project.urls]
Homepage = "https://github.com/AdhamEhab14/brickproof"
Issues = "https://github.com/AdhamEhab14/brickproof/issues"
Changelog = "https://github.com/AdhamEhab14/brickproof/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "brickproof.__version__"}

[tool.setuptools]
# The demo is a package too, so that `pip install brickproof-fw` brings it along and
# `brickproof demo` runs with nothing else to fetch. It lives in examples/ in the repo.
packages = ["brickproof", "brickproof.campaign", "brickproof.engine", "brickproof.engine.renode", "brickproof.drivers", "brickproof.demo"]

[tool.setuptools.package-dir]
brickproof = "src/brickproof"
"brickproof.demo" = "examples/demo_ab_bootloader"

[tool.setuptools.package-data]
# the flash/RCC models run inside Renode, so they ship as data, not modules
brickproof = ["models/*.py", "models/*.cs", "platforms/*.repl"]
"brickproof.demo" = ["*/*.yaml", "firmware/prebuilt/*", "README.md"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/brickproof/models", "adapters/*/can_stub.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

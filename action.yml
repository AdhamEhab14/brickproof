name: BrickProof power-fail test
description: >
  Run a firmware update in an emulator (Renode, or m33mu for the chips Renode does not
  have), cut power at its flash operations, and fail the job if the device does not recover.
branding:
  icon: zap-off
  color: gray-dark

inputs:
  adapter:
    description: Path to the adapter YAML that describes your firmware and its update.
    required: true
  target:
    description: Firmware project folder, if the adapter's own 'target' should be overridden.
    required: false
    default: ""
  args:
    description: >
      Extra options for `brickproof run`, for example "--plan phases --torn --depth 2 -j 3".
    required: false
    default: ""
  report-dir:
    description: Folder the JSON, JUnit and HTML reports are written to.
    required: false
    default: brickproof-report
  upload-report:
    description: Upload the report folder as a workflow artifact ("true" or "false").
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: brickproof-report
  renode-version:
    description: Renode release to run on.
    required: false
    default: "1.17.0"
  m33mu-ref:
    description: >
      m33mu commit to build, for adapters whose chip m33mu emulates (STM32H5).
      Built once and cached.
    required: false
    default: "23960ed50ea186c52dd7799ab1435752c257f4fc"
  python-version:
    description: Python to run BrickProof with.
    required: false
    default: "3.12"

outputs:
  exit-code:
    description: 0 every cut recovered, 1 at least one failed, 2 adapter error, 3 BrickProof itself failed.
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install BrickProof
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Which emulator the adapter's chip runs on
      id: emulator
      shell: bash
      env:
        BP_ADAPTER: ${{ inputs.adapter }}
        BP_TARGET: ${{ inputs.target }}
      run: |
        # an adapter that does not load is reported by the run step; Renode until then
        emulator=$(python -c 'import sys; from brickproof import adapter
        print(adapter.load(sys.argv[1], sys.argv[2] or None).emulator)' "$BP_ADAPTER" "$BP_TARGET" \
          2>/dev/null || echo renode)
        echo "name=$emulator" >> "$GITHUB_OUTPUT"

    - name: Cache Renode
      id: renode-cache
      if: steps.emulator.outputs.name == 'renode'
      uses: actions/cache@v4
      with:
        path: ~/renode
        key: renode-${{ inputs.renode-version }}-${{ runner.os }}

    - name: Install Renode
      if: steps.emulator.outputs.name == 'renode' && steps.renode-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        RENODE_VERSION: ${{ inputs.renode-version }}
      run: |
        mkdir -p ~/renode
        curl -sL "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz" \
          | tar xz -C ~/renode --strip-components=1

    - name: Cache m33mu
      id: m33mu-cache
      if: steps.emulator.outputs.name == 'm33mu'
      uses: actions/cache@v4
      with:
        path: ~/m33mu-bin
        key: m33mu-${{ inputs.m33mu-ref }}-${{ runner.os }}

    - name: Build m33mu
      if: steps.emulator.outputs.name == 'm33mu' && steps.m33mu-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        M33MU_REF: ${{ inputs.m33mu-ref }}
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libelf-dev
        git clone --filter=blob:none https://github.com/danielinux/m33mu.git /tmp/m33mu
        git -C /tmp/m33mu checkout --quiet "$M33MU_REF"
        cmake -S /tmp/m33mu -B /tmp/m33mu/build -DM33MU_BUILD_TESTS=OFF \
          -DM33MU_ENABLE_CAPSTONE=OFF -DM33MU_ENABLE_TPM_LIBTPMS=OFF -DM33MU_ENABLE_WOLFSSL=OFF \
          -DM33MU_ENABLE_LIBDW=OFF -DM33MU_ENABLE_RUST_PLUGINS=OFF
        cmake --build /tmp/m33mu/build -j"$(nproc)" --target m33mu
        mkdir -p ~/m33mu-bin && cp /tmp/m33mu/build/m33mu ~/m33mu-bin/

    - name: Cut power during the update
      id: run
      shell: bash
      # inputs come in through the environment, never pasted into the script
      env:
        BP_ADAPTER: ${{ inputs.adapter }}
        BP_TARGET: ${{ inputs.target }}
        BP_ARGS: ${{ inputs.args }}
        BP_REPORT: ${{ inputs.report-dir }}
      run: |
        export RENODE_PATH="$HOME/renode/renode" M33MU_PATH="$HOME/m33mu-bin/m33mu"
        set -- run "$BP_ADAPTER" --json "$BP_REPORT/report.json" --junit "$BP_REPORT/report.xml" --html "$BP_REPORT/report.html"
        if [ -n "$BP_TARGET" ]; then set -- "$@" --target "$BP_TARGET"; fi
        # shellcheck disable=SC2086  # BP_ARGS is a list of options, split on purpose
        set +e
        brickproof "$@" $BP_ARGS
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code

    - name: Upload the report
      if: always() && inputs.upload-report == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}
